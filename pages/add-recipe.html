<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Uue retsepti loomine</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="/scripts/firebase-config-global.js"></script>
    <script src="/scripts/auth-status.js"></script>
    <link rel="stylesheet" href="../css/add-recipe-style.css">
</head>
<body>
  <h1>Uue retsepti loomine</h1>

  <form id="add-recipe-form">
    <div class="container">

      <div class="form-section">
        <label for="form-name">Pealkiri</label>
        <input type="text" id="form-name" name="title" required placeholder="Sisesta retsepti nimi">

        <label for="form-description">Lühike kirjeldus</label>
        <input type="text" id="form-description" name="description" required placeholder="Lühike tutvustus">

        <label for="form-instructions">Valmistamise juhend</label>
        <textarea id="form-instructions" name="instructions" required placeholder="Kuidas toitu valmistada..."></textarea>

        <label>Toitumisalane teave</label>
        <table class="nutrition-table">
          <tr><th>Kalorid</th><td><input type="number" id="form-calories" placeholder="0" required></td></tr>
          <tr><th>Valgud</th><td><input type="number" id="form-proteins" placeholder="0" required></td></tr>
          <tr><th>Rasvad</th><td><input type="number" id="form-fats" placeholder="0" required></td></tr>
          <tr><th>Süsivesikud</th><td><input type="number" id="form-carbs" placeholder="0" required></td></tr>
        </table>

        <label>Pildi üleslaadimine</label>
        <label for="file-input" id="drop-zone">
          <span id="drop-zone-text">Lohista pilt siia või klõpsa, et valida fail</span>
          <input type="file" id="file-input" accept="image/*">
        </label>

        <div class="buttons">
          <button type="button" class="cancel">Tühista</button>
          <button type="submit" class="submit">Esita retsept</button>
        </div>

      </div> <div class="ingredients-section">
        <label>Koostisosad</label>

        <div class="ingredient-adder">
          <div class="search-box">
            <input type="text" id="product-search" placeholder="Otsi toodet (nt piim)" autocomplete="off">
            <div id="search-results" class="results-dropdown"></div>
          </div>

          <input type="number" id="ingredient-quantity" value="1" style="width: 50px;">
          <input type="text" id="ingredient-quantity-recipe" placeholder="400g" style="width: 70px;">

          <button type="button" id="add-ingredient-btn">Lisa</button>
        </div>

        <ul id="ingredients-list" class="styled-list">
          </ul>

        <div class="price-summary">
          <strong>Retsepti hind kokku: </strong>
          <span id="total-price-display">0.00</span> €
        </div>
      </div>

    </div>
  </form>

  <script type="module" src="../scripts/add-recipe.js"></script>
</body>
</html>
