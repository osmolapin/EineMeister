<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EineMeister</title>
    <link rel="stylesheet" href="/css/product-list-style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="/scripts/firebase-config-global.js"></script>
    
    <script src="/scripts/shopping-cart.js"></script>
    <script src="/scripts/navbar.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/logo.ico">
</head>
<body>
    <header-navbar></header-navbar>
    <a href="/index.html" class="back-button">&lt Tagasi</a>
    <div id="sortSidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        
        <input type="checkbox" name="all" id="all" checked>
        <label for="all" id="label-all" class="active-filter">Kõik tooted</label>
        
        <input type="checkbox" name="category" value="liha" id="liha">
        <label for="liha" class="active-filter">Liha tooted</label>
        
        <input type="checkbox" name="category" value="piimatoode" id="piimatoode">
        <label for="piimatoode" class="active-filter">Piimatooted</label>
        
        <input type="checkbox" name="category" value="oli" id="oli">
        <label for="oli" class="active-filter">Õli tooted</label>
        
        <input type="checkbox" name="category" value="puuvili" id="puuvili">
        <label for="puuvili" class="active-filter">Puuviljad</label>
        
        <input type="checkbox" name="category" value="juurvili" id="juurvili">
        <label for="juurvili" class="active-filter">Juurviljad</label>
        
        <input type="checkbox" name="category" value="kuivaine" id="kuivaine">
        <label for="kuivaine" class="active-filter">Kuivained</label>
        
        <input type="checkbox" name="category" value="kulmutatud" id="kulmutatud">
        <label for="kulmutatud" class="active-filter">Külmutatud tooted</label>
        
        <input type="checkbox" name="category" value="maiustus" id="maiustus">
        <label for="maiustus" class="active-filter">Maiustused</label>

        <input type="checkbox" name="category" value="muna" id="muna">
        <label for="muna" class="active-filter">Muna</label>
    </div>
    
    <span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776; Filtrid</span>
    
    <div class="filter-container">
        <label class="product-filter-title">Sorteeri</label>
        <select class="product-filters" id="product-filters">
            <option value="popular">Populaarsus</option>
            <option value="price-less">Hind: odavamad eespool</option>
            <option value="price-more">Hind: kallimad eespool</option>
            <option value="calories-less">Kalorid: vähem eespool</option>
            <option value="calories-more">Kalorid: rohkem eespool</option>
            <option value="proteins-less">Valgud: vähem eespool</option>
            <option value="proteins-more">Valgud rohkem eespool</option>
        </select>
    </div>
    
    <div id="products-container" class="products-container"></div>
    
    <div id="scroll-watcher" style="height: 20px; margin-bottom: 20px;"></div>
    <script src="/scripts/products.js"></script>
</body>
</html>
